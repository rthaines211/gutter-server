services:
  gutter:
    image: ghcr.io/rthaines211/gutter-server:latest
    restart: unless-stopped
    ports: ["8081:8081"]
    environment:
      GUTTER_PASSWORD: change-me          # required
      # GUTTER_API_KEY: ""                # optional, for scripts (Authorization: Bearer)
      # GUTTER_COMICVINE_KEY: ""          # see docs/CONFIG.md, Metadata
      # GUTTER_WRITEBACK: "true"          # writes into your files; also remove :ro below (docs/CONFIG.md)
    volumes:
      - ./data:/data
      - /path/to/your/comics:/comics:ro   # one folder per series, CBZ/CBR files inside
