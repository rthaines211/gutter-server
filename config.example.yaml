port: 8081
comic_dirs:
  - /comics
cache_max_items: 500
db_path: gutter.db

# Matching needs your own ComicVine dump. Metron, GCD and comicvine_api_key only add to it.
# Path to the offline ComicVine dump. Read-only. Matching is disabled when unset.
localcv_db_path: ""

# Optional: the Grand Comics Database dump (gcd.db, ~6 GB, read-only). Used only
# for folders ComicVine can't pin, and in the console's volume search. Unset = off.
gcd_db_path: ""

# Free key from comicvine.gamespot.com/api. Enables live enrichment and the
# match run's live fill for issues newer than the offline dump (Feb 2026).
# Both share one 180/hr budget. Unset = offline matching only.
comicvine_api_key: ""

# Metron (metron.cloud) fallback metadata provider. Free account.
# Used only where ComicVine (dump + live) can't match. Empty = disabled.
metron_user: ""
metron_pass: ""

# Writeback writes ComicInfo.xml into your files and converts CBR to CBZ.
# Off by default; set false (and mount the library read-write) to opt in.
# GUTTER_WRITEBACK=true/false overrides this. See docs/CONFIG.md.
writeback_disabled: true

bubbles_dir: ""

# Password for every endpoint (HTTP Basic, any username). Required unless
# GUTTER_AUTH=off. Can also be set with GUTTER_PASSWORD.
# password: ""
